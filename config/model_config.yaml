# =========================================
# Data
# =========================================
data:
  # pdb_dir: /home/dvnguye2/PRL/data/pretrain_data/pdb_data
  # surface_dir: /home/dvnguye2/PRL/data/pretrain_data/surface_data
  pdb_dir: /home/dvnguye2/PRL/data/pretrain_data/surface_data/01-benchmark_pdbs
  surface_dir: /home/dvnguye2/PRL/data/pretrain_data/surface_data/01-benchmark_surfaces
  batch_size: 32

# =========================================
# Atom Encoder
# =========================================
atom:
  k: 8
  atom_feat_dim: 6
  hidden_dim: 256
  latent_dim: 128
  n_layers: 4
  lr: 0.0001
  epochs: 50
  save_path: /home/dvnguye2/PRL/ckpts/atom_egnn_encoder.pt
  log_path: /home/dvnguye2/PRL/logs/training_log_atom_encoder.txt

# =========================================
# Surface Encoder
# =========================================
surface:
  input_dim: 16
  hidden_dim: 256
  latent_dim: 128
  n_layers: 4
  lr: 0.0001
  epochs: 50
  max_faces: 1024
  save_path: /home/dvnguye2/PRL/ckpts/surface_emnn_encoder.pt
  log_path: /home/dvnguye2/PRL/logs/training_log_surface_encoder.txt

# =========================================
# Hierarchical GNN
# =========================================

hierarchical:
  hidden_dim: 512
  n_layers: 3
  dropout: 0.5
  input_dims:
    # surface: 128
    # atom: 128
    surface: 3
    atom: 7
    residue: 1152
    sse: 1152
    protein: 1152
  
# =========================================
# Output Heads
# =========================================

head:
  FoldClassification:
    hidden_dim: 512
    num_layers: 3
    dropout: 0.5

  ECReaction:
    hidden_dim: 512
    num_layers: 3
    dropout: 0.5

  GeneOntology:
    hidden_dim: 512
    num_layers: 3
    dropout: 0.5